<!-- JAVASCRIPT APPLICATION LOGIC (FIXED) -->
  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let authMode = 'login';
    let loadedProducts = [];

    window.addEventListener('DOMContentLoaded', async () => {
      checkUserSession();
      loadProducts();
    });

    async function checkUserSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        currentUser = session.user;
        updateUIForAuthenticatedUser();
      }
    }

    function updateUIForAuthenticatedUser() {
      document.getElementById('authContainer').classList.add('hidden');
      document.getElementById('userBanner').classList.remove('hidden');
      document.getElementById('userDisplayName').innerText = currentUser.email;
    }

    function openAuthModal(mode) {
      authMode = mode;
      document.getElementById('modalTitle').innerText = mode === 'login' ? 'Sign In' : 'Register Account';
      document.getElementById('registerFields').classList.toggle('hidden', mode === 'login');
      document.getElementById('authModal').classList.remove('hidden');
    }

    function closeAuthModal() {
      document.getElementById('authModal').classList.add('hidden');
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;

      if (authMode === 'register') {
        const fullName = document.getElementById('authName').value;
        const gcashNumber = document.getElementById('authGcash').value;

        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { data: { full_name: fullName, gcash_number: gcashNumber } }
        });

        if (error) alert('Registration Error: ' + error.message);
        else {
          alert('Registration successful! Check your email or login.');
          closeAuthModal();
        }
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) alert('Login Error: ' + error.message);
        else {
          currentUser = data.user;
          updateUIForAuthenticatedUser();
          closeAuthModal();
        }
      }
    }

    async function logout() {
      await supabase.auth.signOut();
      window.location.reload();
    }

    // FIXED: Universal Tab Switcher
    function switchTab(viewName) {
      if ((viewName === 'seller-dashboard' || viewName === 'buyer-history') && !currentUser) {
        alert('Please log in to access this page.');
        openAuthModal('login');
        return;
      }

      // Hide all main view containers
      const views = ['view-store', 'view-seller-dashboard', 'view-buyer-history'];
      views.forEach(v => {
        const el = document.getElementById(v);
        if (el) el.classList.add('hidden');
      });

      // Show selected target view
      const targetView = document.getElementById(`view-${viewName}`);
      if (targetView) {
        targetView.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // Load specific data depending on tab
      if (viewName === 'seller-dashboard') loadSellerData();
      if (viewName === 'buyer-history') loadBuyerData();
    }

    async function loadProducts() {
      const { data, error } = await supabase
        .from('products')
        .select(`*, reviews(*)`)
        .order('created_at', { ascending: false });

      if (error) return console.error(error);

      loadedProducts = data || [];
      renderProducts(loadedProducts);
    }

    function renderProducts(products) {
      const container = document.getElementById('productGrid');
      if (!products || !products.length) {
        container.innerHTML = `<p class="col-span-full text-center py-12 text-slate-400 text-sm">No items available in store right now.</p>`;
        return;
      }

      container.innerHTML = products.map(prod => {
        const avgRating = prod.reviews?.length 
          ? (prod.reviews.reduce((a, b) => a + b.rating, 0) / prod.reviews.length).toFixed(1) 
          : 'New';

        return `
          <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between group">
            <div>
              <div class="overflow-hidden rounded-xl bg-slate-100 mb-4 h-44">
                <img src="${prod.image_url}" alt="${prod.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
              </div>
              <span class="text-[10px] font-bold text-brand-500 uppercase tracking-wider">${prod.category}</span>
              <h4 class="font-bold text-slate-900 text-base mt-0.5 line-clamp-1">${prod.title}</h4>
              <p class="text-slate-500 text-xs mt-1 line-clamp-2">${prod.description || 'No description provided.'}</p>
              <div class="flex items-center gap-1 text-amber-500 font-bold text-xs mt-2">
                ★ <span>${avgRating}</span> <span class="text-slate-400 font-normal">(${prod.reviews?.length || 0})</span>
              </div>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
              <span class="text-lg font-black text-slate-900">₱${parseFloat(prod.price).toFixed(2)}</span>
              <button onclick="buyProduct('${prod.id}')" class="bg-brand-500 hover:bg-brand-600 text-white font-semibold px-3.5 py-1.5 rounded-lg text-xs shadow-sm transition-colors">Buy</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterProducts() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const filtered = loadedProducts.filter(p => 
        p.title.toLowerCase().includes(term) || p.category.toLowerCase().includes(term)
      );
      renderProducts(filtered);
    }

    async function buyProduct(productId) {
      if (!currentUser) {
        alert('Please login to purchase items.');
        openAuthModal('login');
        return;
      }

      try {
        const response = await fetch('/api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId, buyerId: currentUser.id })
        });

        const data = await response.json();
        if (data.checkoutUrl) window.location.href = data.checkoutUrl;
        else alert('Checkout failed: ' + data.error);
      } catch (err) {
        alert('Payment Error: ' + err.message);
      }
    }

    async function handleCreateProduct(e) {
      e.preventDefault();
      if (!currentUser) return;

      const newProduct = {
        seller_id: currentUser.id,
        title: document.getElementById('prodTitle').value,
        category: document.getElementById('prodCategory').value,
        price: parseFloat(document.getElementById('prodPrice').value),
        image_url: document.getElementById('prodImage').value,
        description: document.getElementById('prodDesc').value
      };

      const { error } = await supabase.from('products').insert([newProduct]);

      if (error) alert('Error creating product: ' + error.message);
      else {
        alert('Product published!');
        document.getElementById('addProductForm').reset();
        loadProducts();
      }
    }

    async function loadSellerData() {
      if (!currentUser) return;

      const { data, error } = await supabase
        .from('orders')
        .select(`*, products(title)`)
        .eq('seller_id', currentUser.id)
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('sellerSalesTable');
      if (error || !data || !data.length) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400 text-sm">No sales recorded yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(o => `
        <tr class="hover:bg-slate-50 transition-colors">
          <td class="p-3 font-mono text-xs text-slate-500">${o.id.substring(0, 8)}...</td>
          <td class="p-3 font-bold text-slate-900">₱${o.amount}</td>
          <td class="p-3"><span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${o.status === 'paid' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${o.status.toUpperCase()}</span></td>
          <td class="p-3 text-xs text-slate-500">${new Date(o.created_at).toLocaleDateString()}</td>
        </tr>
      `).join('');
    }

    async function loadBuyerData() {
      if (!currentUser) return;

      const { data, error } = await supabase
        .from('orders')
        .select(`*, products(id, title)`)
        .eq('buyer_id', currentUser.id)
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('buyerOrdersTable');
      if (error || !data || !data.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400 text-sm">No purchase history.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(o => `
        <tr class="hover:bg-slate-50 transition-colors">
          <td class="p-3 font-bold text-slate-900">${o.products?.title || 'Item'}</td>
          <td class="p-3">₱${o.amount}</td>
          <td class="p-3"><span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${o.status === 'paid' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${o.status.toUpperCase()}</span></td>
          <td class="p-3 text-xs text-slate-500">${new Date(o.created_at).toLocaleDateString()}</td>
          <td class="p-3">
            <button onclick="openReviewModal('${o.products?.id}')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-2.5 py-1 rounded transition-colors">Review</button>
          </td>
        </tr>
      `).join('');
    }

    function openReviewModal(productId) {
      document.getElementById('reviewProductId').value = productId;
      document.getElementById('reviewModal').classList.remove('hidden');
    }

    function closeReviewModal() {
      document.getElementById('reviewModal').classList.add('hidden');
    }

    async function handleReviewSubmit(e) {
      e.preventDefault();
      const productId = document.getElementById('reviewProductId').value;
      const rating = document.querySelector('input[name="rating"]:checked')?.value;
      const comment = document.getElementById('reviewComment').value;

      const { error } = await supabase.from('reviews').insert([{
        product_id: productId,
        user_id: currentUser.id,
        rating: parseInt(rating),
        comment
      }]);

      if (error) alert('Failed to save review: ' + error.message);
      else {
        alert('Review submitted!');
        closeReviewModal();
        loadProducts();
      }
    }
  </script>
