<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artisan Haven</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FBF9F5] text-[#1C1917] min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 bg-[#F8F5F0] border-b border-[#E7E2D9] shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      
      <!-- Logo Link (Opens Main Page) -->
      <a href="index.html" class="flex items-center gap-3 decoration-0">
        <div class="w-10 h-10 bg-[#5C4033] text-[#FBF9F5] flex items-center justify-center font-bold text-xl italic">AH</div>
        <div class="flex flex-col">
          <span class="font-bold text-xl leading-none text-[#1C1917]">Artisan Haven</span>
          <span class="text-[9px] font-semibold tracking-widest uppercase text-gray-500 mt-1">Handcrafted Goods</span>
        </div>
      </a>

      <!-- Center Nav Links -->
      <nav class="hidden lg:flex items-center space-x-6 text-sm font-medium text-gray-600">
        <a href="index.html" class="hover:text-black transition-colors">Home</a>
        <a href="store.html" target="_blank" class="hover:text-black transition-colors">Store Page</a>
        <a href="about.html" target="_blank" class="hover:text-black transition-colors">About Us</a>
        <a href="contact.html" target="_blank" class="hover:text-black transition-colors">Contacts</a>
      </nav>

      <!-- Right Controls -->
      <div class="flex items-center gap-3">
        
        <!-- CLICKABLE SELLER DASHBOARD LINK (Opens in New Tab) -->
        <a href="dashboard.html" target="_blank" class="bg-[#5C4033] hover:bg-[#1C1917] text-white px-4 py-2 rounded-md text-xs font-bold flex items-center gap-2 transition-all shadow cursor-pointer">
          <svg class="w-4 h-4 text-amber-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 00-1 1m-6 0h6"/>
          </svg>
          <span>Seller Dashboard ↗</span>
        </a>

        <!-- Bought History -->
        <a href="history.html" target="_blank" class="text-xs font-semibold text-gray-600 hover:text-black px-2 py-1">
          Bought History
        </a>

        <!-- User Badge -->
        <div class="flex items-center border border-gray-300 bg-white rounded pl-1.5 pr-2 py-1 gap-2 shadow-sm">
          <span class="text-xs font-bold text-gray-800">MATEO DELA...</span>
          <span class="bg-[#5C4033] text-white text-[9px] font-bold px-1.5 py-0.5 rounded uppercase">SELLER</span>
        </div>
      </div>
    </div>
  </header>

  <!-- HOME PAGE CONTENT -->
  <main class="max-w-7xl mx-auto px-6 py-12 flex-grow w-full">
    <div class="bg-white border border-[#E7E2D9] p-8 rounded-lg shadow-sm text-center">
      <h1 class="text-3xl font-bold text-[#1C1917] mb-2">Welcome to Artisan Haven</h1>
      <p class="text-gray-600 mb-6">Click the button below to open your Seller Dashboard in a new browser tab.</p>
      
      <!-- DIRECT TAB LINK -->
      <a href="dashboard.html" target="_blank" class="inline-block bg-[#5C4033] text-white text-sm font-bold px-6 py-3 rounded-md hover:bg-[#1C1917] transition-all shadow">
        Open Seller Dashboard Tab
      </a>
    </div>
  </main>

</body>
</html>
