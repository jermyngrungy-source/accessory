<!-- Interactive Navigation Header -->
<header class="sticky top-0 z-50 bg-[#F8F5F0] border-b border-[#E7E2D9] shadow-sm">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
    
    <!-- Logo -->
    <a href="#" onclick="switchTab('home')" class="flex items-center gap-3">
      <div class="w-10 h-10 bg-[#5C4033] text-[#FBF9F5] flex items-center justify-center font-serif font-bold text-xl italic">AH</div>
      <div class="flex flex-col">
        <span class="font-serif font-bold text-2xl text-[#1C1917] leading-none">Artisan Haven</span>
        <span class="text-[9px] font-semibold tracking-widest uppercase text-gray-500 mt-1">Handcrafted Minimalist Goods</span>
      </div>
    </a>

    <!-- Center Navigation Links -->
    <nav class="hidden lg:flex items-center space-x-6 text-sm font-medium text-gray-600">
      <button onclick="switchTab('home')" class="hover:text-black transition-colors cursor-pointer">Home</button>
      <button onclick="switchTab('store')" class="hover:text-black transition-colors cursor-pointer">Store Page</button>
      <button onclick="switchTab('about')" class="hover:text-black transition-colors cursor-pointer">About Us</button>
      <button onclick="switchTab('contacts')" class="hover:text-black transition-colors cursor-pointer">Contacts</button>
      <button onclick="switchTab('ai-studio')" class="flex items-center gap-1 hover:text-black transition-colors cursor-pointer">
        <span>AI Studio</span>
        <span class="bg-[#E2DDD3] text-[#5C4033] text-[9px] font-bold px-1.5 py-0.5 rounded border border-[#CFC7B9]">GEMINI</span>
      </button>
    </nav>

    <!-- Right Controls -->
    <div class="flex items-center gap-3">
      
      <!-- CLICKABLE SELLER DASHBOARD BUTTON -->
      <button onclick="switchTab('seller-dashboard')" class="bg-[#5C4033] hover:bg-[#1C1917] text-white px-3.5 py-2 rounded-md text-xs font-bold flex items-center gap-2 transition-all cursor-pointer shadow-sm hover:shadow active:scale-95">
        <svg class="w-4 h-4 text-amber-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 00-1 1m-6 0h6"/></svg>
        <span>Seller Dashboard</span>
      </button>

      <button onclick="switchTab('buyer-history')" class="text-xs font-semibold text-gray-600 hover:text-black px-2 py-1 cursor-pointer">
        Bought History
      </button>

      <!-- User Badge -->
      <div class="flex items-center border border-gray-300 bg-white rounded-md pl-1.5 pr-2 py-1 gap-2 shadow-sm">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" class="w-6 h-6 rounded-full object-cover" alt="Avatar">
        <span class="text-xs font-bold uppercase tracking-tight text-gray-800">MATEO DELA...</span>
        <span class="bg-[#5C4033] text-white text-[9px] font-bold px-1.5 py-0.5 rounded tracking-wider uppercase">SELLER</span>
      </div>
    </div>
  </div>
</header>
